<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TotemSMP</title>
    <link rel="icon" href="favicon.ico" type="image/ico">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/flag-icon-css/6.6.6/css/flag-icons.min.css">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="particles-container" id="particles"></div>
    <div class="bg-vignette"></div>

    <nav class="navbar">
        <a href="#" class="nav-logo" id="nav-logo-text">Totem<span>SMP</span></a>
        
        <ul class="nav-menu">
            <li><a href="#hero" id="nav-home">Home</a></li>
            <li><a href="#staff" id="nav-staff">Team</a></li>
            <li><a href="#timeline" id="nav-timeline">Tijdlijn</a></li>
            <li><a href="#rules" id="nav-rules">Rules</a></li>
            <li><a href="#faq" id="nav-faq">FAQ</a></li>
            <li><a href="https://store.totemsmp.nl/" id="nav-store">Store</a></li>
        </ul>

        <div class="custom-lang-selector" id="lang-dropdown-trigger">
            <div class="selected-lang">
                <span id="current-flag" class="fi fi-us"></span>
                <span id="current-lang-name">Nederlands</span>
                <i class="fas fa-chevron-down"></i>
            </div>
            <div class="lang-dropdown" id="lang-list"></div>
        </div>
    </nav>

    <header id="hero">
        <img src="" alt="Logo" class="hero-logo" id="hero-logo-img">
        <p class="hero-subtitle" id="hero-subtitle">Laden...</p>

        <div class="ip-wrapper" onclick="copyIp()">
            <div class="ip-content">
                <i class="fa-brands fa-java"></i>
                <span class="ip-text" id="ip-display">play.server.com</span>
            </div>
            <div class="ip-action">
                <span id="hero-btn-copy">KOPIEEER</span>
            </div>
        </div>

        <div class="bedrock-wrapper" onclick="copyBedrock()">
            <div class="bedrock-content">
                <i class="fa-solid fa-mobile"></i>
                <span class="bedrock-text" id="bedrock-display">play.server.com</span>
            </div>
            <div class="bedrock-action">
                <span id="hero-btn-copy-bedrock">KOPIEEER</span>
            </div>
        </div>
        
        <div class="online-status">
            <span class="dot"></span> <span id="player-count">0</span> <span id="hero-online">online</span>
        </div>

        <div class="social-bar" id="social-container"></div>
    </header>

    <section id="staff">
        <div class="section-header"><h2 id="title-staff">TEAM</h2><div class="gold-line"></div></div>
        <div class="grid-container" id="staff-container"></div>
    </section>

    <section id="timeline">
        <div class="section-header"><h2 id="title-timeline">TIJDLIJN</h2><div class="gold-line"></div></div>
        <div class="timeline-container" id="timeline-container"></div>
    </section>

    <section id="rules">
        <div class="section-header"><h2 id="title-rules">REGELS</h2><div class="gold-line"></div></div>
        <div class="grid-container" id="rules-container"></div>
    </section>

    <section id="faq">
        <div class="section-header"><h2 id="title-faq">FAQ</h2><div class="gold-line"></div></div>
        <div class="faq-grid" id="faq-container"></div>
    </section>

    <section id="legal">
        <div class="section-header"><h2 id="title-legal">JURIDISCH</h2></div>
        <div class="legal-box-wrapper">
            <div class="legal-tabs">
                <button class="l-tab active" onclick="openLegal('tos')" id="tab-tos">Voorwaarden</button>
                <button class="l-tab" onclick="openLegal('notice')" id="tab-notice">Kennisgeving</button>
                <button class="l-tab" onclick="openLegal('priv')" id="tab-priv">Privacy</button>
            </div>
            <div class="legal-content">
                <div id="legal-tos" class="l-content active"></div>
                <div id="legal-notice" class="l-content"></div>
                <div id="legal-priv" class="l-content"></div>
            </div>
        </div>
    </section>

    <footer>
        <p class="copyright">&copy; 2026 <span id="footer-name">Server</span>. Alle rechten voorbehouden.</p>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
